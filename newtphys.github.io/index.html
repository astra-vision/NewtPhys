<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description"
        content="NewtPhys is a 4D physically annotated dataset and benchmark for evaluating whether foundation models understand low-level Newtonian physics.">
  <meta name="keywords" content="NewtPhys, Newtonian Physics, VLM, VFM, Dataset, Benchmark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewtPhys: Coming Soon</title>

  <link href="https://fonts.googleapis.com/css?family=Google+Sans|Noto+Sans|Castoro"
        rel="stylesheet">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍎</text></svg>'>

  <style>
    :root {
      color-scheme: light;
      --ink: #16202a;
      --muted: #5f6d7a;
      --line: #d9e2ea;
      --paper: #f8fafc;
      --accent: #b3262e;
      --accent-dark: #7c1f26;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Google Sans", "Noto Sans", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(179, 38, 46, 0.12), transparent 28rem),
        linear-gradient(135deg, #ffffff 0%, var(--paper) 48%, #eef4f7 100%);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .coming-soon {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(320px, 1.05fr);
      gap: clamp(1.5rem, 4vw, 4rem);
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-dark);
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(2.35rem, 5vw, 5rem);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 1.25rem 0 0;
      max-width: 650px;
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      line-height: 1.55;
      color: var(--muted);
    }

    .notice {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 2rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 45px rgba(22, 32, 42, 0.08);
      font-weight: 700;
    }

    .notice-mark {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 0.35rem rgba(179, 38, 46, 0.12);
      flex: 0 0 auto;
    }

    .preview {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(22, 32, 42, 0.12);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 28px 80px rgba(22, 32, 42, 0.16);
    }

    .preview img {
      display: block;
      width: 100%;
      aspect-ratio: 1.23;
      object-fit: cover;
    }

    .preview::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(22, 32, 42, 0.72));
      pointer-events: none;
    }

    .preview-caption {
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
      z-index: 1;
      margin: 0;
      color: #ffffff;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    @media (max-width: 840px) {
      main {
        place-items: start center;
      }

      .coming-soon {
        grid-template-columns: 1fr;
      }

      .preview {
        order: -1;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="coming-soon" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Sneak peek</p>
        <h1 id="page-title">NewtPhys is almost ready.</h1>
        <p class="subtitle">
          A 4D physically annotated dataset and benchmark for probing whether foundation models understand Newtonian physics.
        </p>
        <p class="notice">
          <span class="notice-mark" aria-hidden="true"></span>
          Full page coming soon. Stay tuned.
        </p>
      </div>

      <figure class="preview">
        <img src="./static/images/newtphys/collage_sl1_sa7_f1_teaser.png"
             alt="Preview collage of NewtPhys scenes with physics annotations.">
        <figcaption class="preview-caption">
          Preview: real-world scenes with force, motion, visibility, and collision annotations.
        </figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
